<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spatial Sound Settings</title>
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Fixed Color">
      <sdpi-color setting="fixedColor" default="#D68910"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Headtracking Color">
      <sdpi-color setting="headtrackingColor" default="#D4AC0D"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Offline Color">
      <sdpi-color setting="offlineColor" default="#3D3D3D"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="No Dongle Color">
      <sdpi-color setting="noDongleColor" default="#5A1A1A"></sdpi-color>
    </sdpi-item>
  </body>
</html>
